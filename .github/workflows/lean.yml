name: Lean Build & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Show toolchain
        run: |
          cat lean-toolchain
          elan --version || true
          lean --version || true

      - name: Lake build
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log

      - name: Check no sorry
        run: |
          if grep -rn "sorry" --include="*.lean" Assurance/Crypto Assurance/Trust 2>/dev/null; then
            echo "sorry found"
            exit 1
          fi
          echo "Sorry count: 0"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
