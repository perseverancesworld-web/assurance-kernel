name: Lean Build & Verification

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan + toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.12.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          elan show || true
          lean --version
          lake --version

      - name: Lake build
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          set -o pipefail
          lake build 2>&1 | tee build.log
          echo "EXIT CODE: $?"

      - name: Show build log
        if: failure()
        run: |
          echo "===== build.log ====="
          cat build.log || echo "(no build.log)"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
